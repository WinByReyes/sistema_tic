# =========================================================
# PERFIL PRODUCCIÓN (RENDER + SUPABASE)
# =========================================================

# =========================================================
# BASE DE DATOS (SUPABASE POSTGRESQL)
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimización del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# =========================================================
# JPA / HIBERNATE
# =========================================================
# 'update' mantiene el esquema sincronizado con el nuevo backup/BD sin eliminar datos
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# THYMELEAF (Caché activado en producción para rendimiento)
# =========================================================
spring.thymeleaf.cache=true

# =========================================================
# RESPALDOS (Desactivados en la nube Render por defecto)
# =========================================================
backup.enabled=${BACKUP_ENABLED:false}
backup.directory=${BACKUP_DIRECTORY:backups}
backup.pg-dump-path=${PG_DUMP_PATH:pg_dump}

backup.database.host=${DB_HOST:}
backup.database.port=${DB_PORT:5432}
backup.database.name=${DB_NAME:postgres}
backup.database.username=${DB_USERNAME:}
backup.database.password=${DB_PASSWORD:}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
